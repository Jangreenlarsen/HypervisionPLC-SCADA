<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="330" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" font-weight="700" fill="#1f1f1f">Tidsforløb: operatøren skifter fra "Fra" til "Auto"</text>
  <line x1="60" y1="250" x2="960" y2="250" stroke="#888" stroke-width="2"/>
  <g font-size="12" fill="#5c5c5c" text-anchor="middle">
    <line x1="160" y1="244" x2="160" y2="256" stroke="#888"/><text x="160" y="272">0 s</text>
    <line x1="420" y1="244" x2="420" y2="256" stroke="#888"/><text x="420" y="272">≈ 1–2 s</text>
    <line x1="760" y1="244" x2="760" y2="256" stroke="#888"/><text x="760" y="272">5 s (Tid til at bekræfte)</text>
  </g>
  <!-- faser -->
  <rect x="60" y="60" width="100" height="160" fill="#f5f5f5" stroke="#bbb"/>
  <text x="110" y="85" font-size="13" font-weight="600" text-anchor="middle">Før</text>
  <text x="110" y="110" font-size="12" text-anchor="middle">Viser: Fra</text>
  <circle cx="110" cy="150" r="13" fill="#e7f2e8" stroke="#2e7d32" stroke-width="1.5"/><text x="110" y="155" font-size="13" font-weight="700" text-anchor="middle" fill="#2e7d32">✓</text>
  <text x="110" y="190" font-size="11" text-anchor="middle" fill="#5c5c5c">bekræftet</text>

  <rect x="160" y="60" width="260" height="160" fill="#fff4e0" stroke="#b26a00"/>
  <text x="290" y="85" font-size="13" font-weight="600" text-anchor="middle">Kommando skrevet</text>
  <text x="290" y="110" font-size="12" text-anchor="middle">Viser stadig: Fra (PLC'ens tilbagemelding)</text>
  <circle cx="290" cy="150" r="13" fill="#fff4e0" stroke="#b26a00" stroke-width="1.5"/><text x="290" y="155" font-size="13" font-weight="700" text-anchor="middle" fill="#b26a00">…</text>
  <text x="290" y="190" font-size="11" text-anchor="middle" fill="#5c5c5c">venter — symbolet springer ikke frem</text>

  <rect x="420" y="60" width="540" height="160" fill="#eaf4eb" stroke="#2e7d32"/>
  <text x="690" y="85" font-size="13" font-weight="600" text-anchor="middle">Tilbagemeldingen viser Auto</text>
  <text x="690" y="110" font-size="12" text-anchor="middle">Viser: Auto — grebet drejer, farver pr. position skifter</text>
  <circle cx="690" cy="150" r="13" fill="#e7f2e8" stroke="#2e7d32" stroke-width="1.5"/><text x="690" y="155" font-size="13" font-weight="700" text-anchor="middle" fill="#2e7d32">✓</text>
  <text x="690" y="190" font-size="11" text-anchor="middle" fill="#5c5c5c">bekræftet</text>

  <text x="20" y="300" font-size="12" fill="#5c5c5c">Kommer tilbagemeldingen aldrig: efter 5 s står symbolet stadig i PLC'ens position (Fra) som bekræftet — med "Vis: PLC'ens position" vises PLC'ens virkelighed, ikke ønsket.</text>
  <text x="20" y="318" font-size="12" fill="#5c5c5c">Vil du se, at et valg ikke blev udført (afvigelse og alarm), så brug "Vis: Valgt position".</text>
</svg>
