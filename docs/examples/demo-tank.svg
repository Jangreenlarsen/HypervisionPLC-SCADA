<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Segoe UI, Arial, sans-serif">
  <title>Demo: tank med pumpe (mock-PLC)</title>
  <rect x="0" y="0" width="800" height="420" fill="#d9d9d9"/>
  <text x="24" y="38" font-size="22" font-weight="600" fill="#333">Tankanlæg — demo</text>

  <!-- Tank: TankFyld bindes eksplicit med "level" til Tank_Niveau -->
  <rect x="80" y="80" width="160" height="260" rx="8" fill="#eeeeee" stroke="#555" stroke-width="3"/>
  <rect id="TankFyld" x="83" y="83" width="154" height="254" rx="5" fill="#7aa7c7"/>
  <text x="160" y="368" font-size="15" text-anchor="middle" fill="#333">Tank T1</text>
  <text id="Tank_Niveau" x="160" y="215" font-size="24" font-weight="600" text-anchor="middle" fill="#1f1f1f">--</text>

  <!-- Rør -->
  <path d="M240 300 H360" stroke="#555" stroke-width="8" fill="none"/>
  <path d="M440 300 H600 V160 H680" stroke="#555" stroke-width="8" fill="none"/>

  <!-- Pumpe: id = tag-navn → auto-binding (fill grøn ved drift) -->
  <g id="Pumpe_Drift">
    <circle cx="400" cy="300" r="40" fill="#9e9e9e" stroke="#555" stroke-width="3"/>
    <path d="M385 278 L425 300 L385 322 Z" fill="#9e9e9e" stroke="#333" stroke-width="2"/>
  </g>
  <text x="400" y="365" font-size="15" text-anchor="middle" fill="#333">Pumpe P1</text>

  <!-- Måleværdier -->
  <rect x="560" y="60" width="200" height="70" rx="4" fill="#eeeeee" stroke="#888"/>
  <text x="575" y="85" font-size="13" fill="#5c5c5c">Temperatur TT1</text>
  <text id="Temperatur" x="575" y="117" font-size="24" font-weight="600" fill="#1f1f1f">--</text>

  <rect x="560" y="200" width="200" height="70" rx="4" fill="#eeeeee" stroke="#888"/>
  <text x="575" y="225" font-size="13" fill="#5c5c5c">Niveau fra ST-program</text>
  <text id="ST_Niveau" x="575" y="257" font-size="24" font-weight="600" fill="#1f1f1f">--</text>

  <!-- Dør-kontakt: id = tag-navn → auto-binding -->
  <circle id="Doer_Aaben" cx="300" cy="120" r="14" fill="#9e9e9e" stroke="#555" stroke-width="2"/>
  <text x="322" y="126" font-size="15" fill="#333">Dør åben</text>

  <text x="300" y="175" font-size="13" fill="#5c5c5c">Driftsform</text>
  <text id="Driftsform" x="390" y="175" font-size="15" font-weight="600" fill="#1f1f1f">--</text>
</svg>
