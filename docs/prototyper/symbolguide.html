<title>Symbolguide-prototype</title>
<style>
/* Layout: SCADA-app-skal — topbar med to faner; guiden er et panel med trinlinje, Overview er tegning + dialog + PLC-simulator side om side. Farver følger projektets ISA-101-tokens (grå flade, farve kun for tilstand). */
:root {
  --bg: #d9d9d9; --panel: #eeeeee; --panel-2: #e3e3e3; --field: #ffffff; --line: #b8b8b8;
  --text: #1f1f1f; --muted: #5c5c5c; --bar: #2b2b2b; --bar-text: #ffffff; --bar-muted: #bdbdbd;
  --accent: #1f5f99; --accent-bg: #e6eef6; --on-accent: #ffffff;
  --ok: #2e7d32; --ok-bg: #e7f2e8; --warn: #9a5c00; --warn-bg: #fff4e0; --alarm: #c62828; --alarm-bg: #fdecea;
  --sym-face: #e3e3e3; --sym-line: #555555; --sym-grip: #9e9e9e; --sym-ink: #333333;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Consolas, monospace;
  --radius: 4px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1b1d1f; --panel: #26292c; --panel-2: #2f3236; --field: #1f2225; --line: #474b50;
  --text: #e6e6e6; --muted: #a3a7ab; --bar: #111213; --bar-text: #f2f2f2; --bar-muted: #8f9397;
  --accent: #6ea8dc; --accent-bg: #1f3347; --on-accent: #0d1a26;
  --ok: #6cc070; --ok-bg: #1d3320; --warn: #e2a64a; --warn-bg: #3a2c12; --alarm: #ef6a6a; --alarm-bg: #3d1d1d;
  --sym-face: #3a3e43; --sym-line: #9aa0a6; --sym-grip: #6b7075; --sym-ink: #e6e6e6; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #1b1d1f; --panel: #26292c; --panel-2: #2f3236; --field: #1f2225; --line: #474b50;
  --text: #e6e6e6; --muted: #a3a7ab; --bar: #111213; --bar-text: #f2f2f2; --bar-muted: #8f9397;
  --accent: #6ea8dc; --accent-bg: #1f3347; --on-accent: #0d1a26;
  --ok: #6cc070; --ok-bg: #1d3320; --warn: #e2a64a; --warn-bg: #3a2c12; --alarm: #ef6a6a; --alarm-bg: #3d1d1d;
  --sym-face: #3a3e43; --sym-line: #9aa0a6; --sym-grip: #6b7075; --sym-ink: #e6e6e6; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.4; }
h1, h2, h3 { font-weight: 650; margin: 0; text-wrap: balance; }
h2 { font-size: 1.1rem; } h3 { font-size: 1rem; }
code, .mono { font-family: var(--mono); font-size: .88em; }
.muted { color: var(--muted); } .small { font-size: .85rem; }
button, input, select { font: inherit; color: inherit; }
button { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: .4rem .85rem; cursor: pointer; min-height: 36px; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
button.ghost { border-style: dashed; color: var(--accent); background: transparent; }
button:disabled { opacity: .5; cursor: default; }
input, select { background: var(--field); border: 1px solid var(--line); border-radius: var(--radius); padding: .35rem .5rem; min-width: 0; min-height: 34px; }
input.bad { border: 2px solid var(--alarm); background: var(--alarm-bg); }

.topbar { background: var(--bar); color: var(--bar-text); padding: .6rem 16px; display: flex; flex-wrap: wrap; gap: .4rem 1.2rem; align-items: center; }
.topbar .brand { font-weight: 650; margin-right: .6rem; }
.topbar button { background: transparent; border: 0; border-bottom: 2px solid transparent; border-radius: 0; color: var(--bar-muted); padding: .3rem .1rem; min-height: 32px; }
.topbar button[aria-selected="true"] { color: var(--bar-text); border-bottom-color: var(--bar-text); }
.topbar .note { margin-left: auto; color: var(--bar-muted); font-size: .8rem; }

.wrap { max-width: 1240px; margin: 0 auto; padding-block: 18px 40px; padding-inline: 16px; display: flex; flex-direction: column; gap: 16px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
.panel-head { padding: .8rem 1rem; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: .6rem; }
.panel-body { padding: 1rem; display: flex; flex-direction: column; gap: 1rem; }
.panel-foot { padding: .75rem 1rem; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: .5rem; flex-wrap: wrap; }
.row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
.split { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
.split > * { min-width: 0; }

.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; }
.steps button { width: 100%; text-align: left; font-size: .82rem; background: var(--panel-2); border: 1px solid transparent; color: var(--muted); padding: .35rem .5rem; }
.steps button.done { color: var(--text); }
.steps button.current { background: var(--accent); color: var(--on-accent); font-weight: 650; }
.steps button .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--alarm); margin-left: 4px; vertical-align: middle; }

.field { display: flex; flex-direction: column; gap: .25rem; font-size: .85rem; color: var(--muted); }
.field > input, .field > select { color: var(--text); font-size: .95rem; }
.sigs { display: grid; grid-template-columns: 3rem minmax(0, 1fr) minmax(0, 1fr) 7rem 2.6rem; gap: .5rem .6rem; align-items: end; }
.sigs .lbl { font-weight: 650; padding-bottom: .45rem; }
@media (max-width: 720px) { .sigs { grid-template-columns: minmax(0, 1fr); } .sigs .lbl { grid-column: 1 / -1; padding: .4rem 0 0; } .sigs .hdr { display: none; } }

.tablebox { overflow-x: auto; background: var(--field); border: 1px solid var(--line); border-radius: var(--radius); }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { padding: .5rem .6rem; border-bottom: 1px solid var(--panel-2); text-align: left; vertical-align: middle; }
thead th { background: var(--panel-2); font-weight: 600; border-bottom: 1px solid var(--line); }
td.c, th.c { text-align: center; }
.matrix { min-width: 640px; font-variant-numeric: tabular-nums; }
.matrix thead input { width: 6.5rem; text-align: center; font-weight: 650; }
.cell-coil { width: 4.6rem; font-weight: 600; }
.cell-coil.on { border-color: var(--ok); background: var(--ok-bg); }
.cell-coil.off { color: var(--muted); }
.cell-coil.skip { border-style: dashed; background: transparent; color: var(--muted); }
.cell-num { width: 4.6rem; text-align: center; }
.cell-num.skip { border-style: dashed; }
.sub { font-size: .75rem; color: var(--muted); font-weight: 400; }

.checks { display: flex; flex-direction: column; gap: .25rem; font-size: .9rem; }
.ck-ok { color: var(--ok); } .ck-warn { color: var(--warn); } .ck-err { color: var(--alarm); font-weight: 600; }
.box { border: 1px solid var(--line); border-radius: var(--radius); padding: .75rem .9rem; background: var(--field); }
.box.ok { background: var(--ok-bg); border-color: var(--ok); }
.box.warn { background: var(--warn-bg); border-color: var(--warn); }
.box.err { background: var(--alarm-bg); border-color: var(--alarm); }
fieldset { margin: 0; border: 1px solid var(--line); border-radius: var(--radius); padding: .6rem .9rem .8rem; background: var(--field); display: flex; flex-direction: column; gap: .5rem; }
legend { font-weight: 600; padding: 0 .3rem; }
.choice { display: flex; gap: .6rem; align-items: flex-start; }
.choice input { margin-top: .25rem; min-height: 0; }
.check { display: flex; gap: .5rem; align-items: center; }
.check input { min-height: 0; }
dl.sum { margin: 0; display: grid; grid-template-columns: 9rem minmax(0, 1fr); gap: .35rem .8rem; font-size: .92rem; }
dl.sum dt { color: var(--muted); } dl.sum dd { margin: 0; }

/* Symbol */
.sym { display: block; }
.sym .face { fill: var(--sym-face); stroke: var(--sym-line); stroke-width: 2.5; }
.sym .lab { fill: var(--sym-ink); font: 600 12px var(--font); }
.sym .tick { stroke: var(--sym-ink); stroke-width: 2; }
.sym .grip { fill: var(--sym-grip); stroke: var(--sym-ink); stroke-width: 1.5; }
.sym .grip-mark { fill: var(--sym-ink); }
.sym .grip.pending { fill: var(--field); stroke-dasharray: 3 2; }
.sym .grip.unknown { fill: var(--panel-2); stroke: var(--muted); }
.sym .grip-mark.unknown { fill: var(--muted); }
.sym .ghost { fill: var(--alarm-bg); stroke: var(--alarm); stroke-width: 1.5; stroke-dasharray: 3 2; opacity: .75; }
.sym .badge { stroke-width: 2; }
.sym .badge.confirmed { fill: var(--ok-bg); stroke: var(--ok); } .sym .glyph.confirmed { fill: var(--ok); }
.sym .badge.pending { fill: var(--warn-bg); stroke: var(--warn); } .sym .glyph.pending { fill: var(--warn); }
.sym .badge.mismatch { fill: var(--alarm-bg); stroke: var(--alarm); } .sym .glyph.mismatch { fill: var(--alarm); }
.sym .badge.unknown { fill: var(--panel-2); stroke: var(--muted); } .sym .glyph.unknown { fill: var(--text); }
.sym .glyph { font: 700 14px var(--font); }
.sym .faultframe { fill: none; stroke: var(--alarm); stroke-width: 3; animation: blink 1s steps(2, start) infinite; }
@keyframes blink { to { visibility: hidden; } }
.sym .blinking { animation: blink 1s steps(2, start) infinite; }
.sym .blink-slow { animation-duration: 2s; } .sym .blink-fast { animation-duration: .5s; }
@media (prefers-reduced-motion: reduce) { .sym .blinking { animation: none; opacity: .5; } }
.anims { display: flex; flex-direction: column; gap: .6rem; }
.anim { background: var(--field); border: 1px solid var(--line); border-radius: var(--radius); padding: .6rem .7rem; display: flex; flex-direction: column; gap: .5rem; }
.anim .head { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; }
.anim .head .no { font-weight: 650; min-width: 1.6rem; }
.anim .params { display: flex; flex-wrap: wrap; gap: .4rem .8rem; align-items: center; font-size: .88rem; }
.anim input[type="color"] { width: 2.6rem; height: 32px; padding: 2px; }
.anim input[type="number"] { width: 5.5rem; }
.anim .params label { display: inline-flex; gap: .3rem; align-items: center; }
@media (prefers-reduced-motion: reduce) { .sym .faultframe { animation: none; } }

.symbtn { background: var(--field); border: 1px solid var(--line); padding: .6rem; border-radius: var(--radius); display: flex; flex-direction: column; align-items: center; gap: .3rem; }
.state-chip { font-size: .8rem; font-weight: 650; padding: .1rem .55rem; border-radius: 99px; border: 1px solid; }
.state-chip.confirmed { color: var(--ok); border-color: var(--ok); background: var(--ok-bg); }
.state-chip.pending { color: var(--warn); border-color: var(--warn); background: var(--warn-bg); }
.state-chip.mismatch { color: var(--alarm); border-color: var(--alarm); background: var(--alarm-bg); }
.state-chip.unknown { color: var(--muted); border-color: var(--line); background: var(--panel-2); }
.posbtns { display: grid; grid-template-columns: repeat(auto-fit, minmax(5.5rem, 1fr)); gap: .5rem; }
.posbtns button { min-height: 48px; font-weight: 650; background: var(--field); }
.posbtns button.sel { border: 2px solid var(--accent); background: var(--accent-bg); }
.posbtns button.now { color: var(--muted); }
.log { font-family: var(--mono); font-size: .8rem; display: flex; flex-direction: column; gap: .15rem; max-height: 12rem; overflow: auto; }
.log .t { color: var(--muted); }
.alarmrow { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; }
.prio { background: var(--warn); color: var(--panel); font-size: .72rem; font-weight: 700; padding: .1rem .5rem; border-radius: 3px; letter-spacing: .04em; }
.toast { background: var(--ok-bg); border: 1px solid var(--ok); border-radius: var(--radius); padding: .5rem .8rem; }
.sym .face.pending { stroke-dasharray: 4 3; fill: var(--field); }
.sym .face.unknown { fill: var(--panel-2); stroke: var(--muted); }
.sym .body { fill: var(--sym-face); stroke: var(--sym-line); stroke-width: 2.5; }
.sym .part-line { stroke: var(--sym-line); stroke-width: 2.5; fill: none; }
.sym .imp { fill: var(--sym-grip); stroke: var(--sym-ink); stroke-width: 1.5; }
.sym .act { fill: var(--sym-grip); stroke: var(--sym-ink); stroke-width: 1.5; }
.sym .level { fill: var(--accent); opacity: .55; }
.sym .postext { fill: var(--sym-ink); font: 650 13px var(--font); }
.sym .bigtext { fill: var(--sym-ink); font: 700 16px var(--font); }
.sym .valtext { fill: var(--sym-ink); font: 700 15px var(--font); }
.sym .ghosttext { fill: var(--alarm); font: 650 11px var(--font); }
.sym .spinning { animation: spin 1.6s linear infinite; transform-box: fill-box; transform-origin: center; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .sym .spinning { animation: none; } }
.layout { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
.layout > .side { flex: 0 1 270px; min-width: 0; }
.layout > .main { flex: 999 1 560px; min-width: 0; }
.symlist { display: flex; flex-direction: column; gap: .4rem; }
.symlist button { display: flex; gap: .6rem; align-items: center; text-align: left; background: var(--field); padding: .35rem .5rem; }
.symlist button.sel { border: 2px solid var(--accent); background: var(--accent-bg); }
.symlist .nm { font-weight: 650; display: block; }
.symlist .tp { font-size: .78rem; color: var(--muted); }
.libgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(8.5rem, 1fr)); gap: .5rem; }
.libgrid button { display: flex; flex-direction: column; align-items: center; gap: .2rem; background: var(--field); padding: .5rem; }
.libgrid button.sel { border: 2px solid var(--accent); background: var(--accent-bg); }
.plant { display: grid; grid-template-columns: repeat(auto-fill, minmax(10.5rem, 1fr)); gap: .6rem; }
.plant .symbtn.sel { border: 2px solid var(--accent); }
.steps button.skip { opacity: .55; font-style: italic; }
.sym .padlock rect { fill: var(--warn); } .sym .padlock path { fill: none; stroke: var(--warn); stroke-width: 2.5; }
.lockico { display: inline-block; width: .8em; height: .9em; vertical-align: -.1em; margin-left: .3rem; }
.lockico rect { fill: var(--warn); } .lockico path { fill: none; stroke: var(--warn); stroke-width: 2.5; }
.posbtns button.locked { border-color: var(--warn); }
.pinrow { display: flex; flex-wrap: wrap; gap: .5rem; align-items: end; }
.pinrow input { width: 7rem; font-family: var(--mono); letter-spacing: .4em; text-align: center; }
</style>

<script>
// ===================================================================== tags
const TAGS = [
  { name: 'P1_hand_koer', src: 'plc1:coil:10', kind: 'coil', writable: true },
  { name: 'P1_auto_frigiv', src: 'plc1:coil:11', kind: 'coil', writable: true },
  { name: 'P1_stop', src: 'plc1:coil:12', kind: 'coil', writable: true },
  { name: 'P1_start', src: 'plc1:coil:13', kind: 'coil', writable: true },
  { name: 'V1_aaben', src: 'plc1:coil:30', kind: 'coil', writable: true },
  { name: 'K1_koer', src: 'plc1:coil:40', kind: 'coil', writable: true },
  { name: 'Vaelger_bit0', src: 'plc1:coil:20', kind: 'coil', writable: true },
  { name: 'Vaelger_bit1', src: 'plc1:coil:21', kind: 'coil', writable: true },
  { name: 'Vaelger_bit2', src: 'plc1:coil:22', kind: 'coil', writable: true },
  { name: 'Vaelger_bit3', src: 'plc1:coil:23', kind: 'coil', writable: true },
  { name: 'P1_driftsform', src: 'plc1:hr:40', kind: 'reg', dt: 'uint', writable: true },
  { name: 'Kedel_mode', src: 'plc1:hr:41', kind: 'reg', dt: 'uint', writable: true },
  { name: 'P1_offset', src: 'plc1:hr:42', kind: 'reg', dt: 'int', writable: true },
  { name: 'Kedel_trin', src: 'plc1:hr:43', kind: 'reg', dt: 'uint', writable: true, min: 0, max: 10 },
  { name: 'P1_hand_di', src: 'plc1:di:10', kind: 'coil', writable: false },
  { name: 'Vaelger_bit0_di', src: 'plc1:di:20', kind: 'coil', writable: false },
  { name: 'Vaelger_bit1_di', src: 'plc1:di:21', kind: 'coil', writable: false },
  { name: 'Vaelger_bit2_di', src: 'plc1:di:22', kind: 'coil', writable: false },
  { name: 'P1_drift', src: 'plc1:di:15', kind: 'coil', writable: false },
  { name: 'P1_fejl', src: 'plc1:di:14', kind: 'coil', writable: false },
  { name: 'V1_aaben_di', src: 'plc1:di:30', kind: 'coil', writable: false },
  { name: 'T1_hoej', src: 'plc1:di:50', kind: 'coil', writable: false },
  { name: 'L1_alarm', src: 'plc1:di:51', kind: 'coil', writable: false },
  { name: 'P1_driftsform_fb', src: 'plc1:ir:12', kind: 'reg', dt: 'uint', writable: false },
  { name: 'P1_temp', src: 'plc1:ir:30', kind: 'reg', dt: 'int', writable: false },
  { name: 'T1_niveau', src: 'plc1:ir:50', kind: 'reg', dt: 'uint', writable: false, min: 0, max: 100 },
];
const tag = (n) => TAGS.find((t) => t.name === n);
const DT_RANGE = { uint: [0, 65535], int: [-32768, 32767] };
const range = (t) => { const [lo, hi] = DT_RANGE[t.dt || 'uint']; return [t.min ?? lo, t.max ?? hi]; };
const rangeText = (t) => { const [lo, hi] = range(t); return (t.min != null || t.max != null) ? `tal ${lo}–${hi} (tagets min/max)` : `${t.dt || 'uint'} ${lo}–${hi}`; };
const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const fmtT = (t) => new Date(t).toLocaleTimeString('da-DK', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
const isSet = (v) => v != null && v !== '';
const hide = 'position:absolute;left:-9999px';
const STEPS = ['Symbol', 'Signaler', 'Kontakter', 'Visning', 'Betjening', 'Test og gem'];
const STATE_TXT = { confirmed: 'Bekræftet', pending: 'Venter', mismatch: 'Afvigelse', unknown: 'Ukendt', view: 'Visning' };
const GLYPH = { confirmed: '✓', pending: '…', mismatch: '!', unknown: '?' };
const ATYPES = { color: 'Farve', blink: 'Blink', visible: 'Synlig', spin: 'Roterer', level: 'Niveau', value: 'Værdi' };

// ===================================================================== symbolbibliotek
// Alle symboler følger samme standard: dele (til animationer), evt. positioner (betjening via kontaktplaner),
// samme guide i 6 trin og samme tilstandsmærke. Kun tegningen og standardopsætningen er forskellig.
const LIB = {
  selector: { label: 'Omskifter', positions: [['Hand', -45], ['0', 0], ['Auto', 45]], angles: true,
    parts: { bg: 'Baggrund', face: 'Skive', grip: 'Greb', frame: 'Ramme' }, spin: [], level: [], text: [] },
  startstop: { label: 'Start/stop', positions: [['Stop'], ['Start']],
    parts: { bg: 'Baggrund', face: 'Knap', text: 'Tekst', frame: 'Ramme' }, spin: [], level: [], text: ['text'] },
  pump: { label: 'Pumpe', positions: [['Stop'], ['Start']],
    parts: { bg: 'Baggrund', face: 'Pumpehus', grip: 'Løbehjul', frame: 'Ramme' }, spin: ['grip'], level: [], text: [] },
  valve: { label: 'Motorventil', positions: [['Lukket'], ['Åben']],
    parts: { bg: 'Baggrund', face: 'Ventilhus', grip: 'Aktuator', frame: 'Ramme' }, spin: [], level: [], text: [] },
  tank: { label: 'Tank', positions: null,
    parts: { bg: 'Baggrund', face: 'Beholder', level: 'Niveau', text: 'Værdi', frame: 'Ramme' }, spin: [], level: ['level'], text: ['text'] },
  lamp: { label: 'Lampe', positions: null,
    parts: { bg: 'Baggrund', face: 'Lampe', frame: 'Ramme' }, spin: [], level: [], text: [] },
};
const hasPos = (c) => !!LIB[c.type].positions;

let sigSeq = 100;
const newSignal = (t = '', fb = '') => ({ id: `S${++sigSeq}`, tag: t, fb, write: 'set', ms: 500, rest: '' });
function newSymbol(type, name) {
  const L = LIB[type];

      if (s.fb && tag(s.fb)?.kind !== t.kind) step2.push(`${s.id}: tilbagemeldingen har en anden type end kommandoen.`);
      if (!usedBy(c, s).length) W.push(`${s.id} (${s.tag}) bruges ikke af nogen kontaktplan.`);
    });
    if (labels.some((l) => !l)) step3.push('Alle positioner skal have et navn.');
    if (new Set(labels).size !== labels.length) step3.push('To positioner har samme navn.');
    if (!c.planes.length) step3.push('Opret mindst én kontaktplan.');
    c.planes.forEach((p, i) => {
      const nm = `Plan ${i + 1}`, s = sig(c, p.signal), t = tag(s?.tag);
      if (!s) { step3.push(`${nm}: vælg hvilket signal planet styrer.`); return; }
      const first = c.planes.findIndex((q) => q.signal === p.signal);
      if (first !== i) step3.push(`${nm}: ${s.id} styres allerede af plan ${first + 1} — ét signal pr. plan.`);
      p.values.forEach((v, j) => {
        if (!isSet(v) || t?.kind !== 'reg') return;
        const x = Number(v);
        if (!Number.isInteger(x)) step3.push(`${nm}, ${labels[j] || j + 1}: "${v}" er ikke et heltal.`);
        else if (x < range(t)[0] || x > range(t)[1]) step3.push(`${nm}, ${labels[j] || j + 1}: ${x} er uden for ${rangeText(t)} for ${s.tag}.`);
      });
      const skip = p.values.map((v, j) => (isSet(v) ? null : `"${labels[j]}"`)).filter(Boolean);
      if (skip.length) W.push(`${nm} røres ikke i ${skip.join(', ')} — ${s.id} beholder værdien fra forrige position.`);
    });
    const readable = c.planes.filter((p) => sig(c, p.signal) && sig(c, p.signal).write !== 'pulse');
    const cols = c.positions.map((_, j) => JSON.stringify(readable.map((p) => (isSet(p.values[j]) ? Number(p.values[j]) : null))));
    cols.forEach((col, j) => { const k = cols.indexOf(col); if (k !== j) step3.push(`"${labels[k]}" og "${labels[j]}" har ens kontaktmønster og kan ikke skelnes.`); });
    c.signals.forEach((s) => {
      if (s.write !== 'pulse') return;
      const ms = Number(s.ms), vals = c.planes.filter((p) => p.signal === s.id).flatMap((p) => p.values.filter(isSet).map(Number));
      if (!(ms >= 100 && ms <= 10000)) step5.push(`${s.id}: pulslængde skal være 100–10000 ms.`);
      if (!isSet(s.rest)) step5.push(`${s.id}: hvileværdien skal sættes.`);
      else { const r = Number(s.rest), t = tag(s.tag);
        if (!Number.isInteger(r)) step5.push(`${s.id}: hvileværdien skal være et heltal.`);
        else if (vals.includes(r)) step5.push(`${s.id}: hvileværdien ${r} er også en positions værdi.`);
        else if (t?.kind === 'reg' && (r < range(t)[0] || r > range(t)[1])) step5.push(`${s.id}: hvileværdien ${r} er uden for ${rangeText(t)}.`); }
    });
    if (c.lock.positions.some(Boolean) && !/^\d{4}$/.test(c.lock.pin || '')) step5.push('Koden til nøglelåsen skal være præcis 4 cifre.');
    if (c.lock.positions.length && c.lock.positions.every(Boolean)) W.push('Alle positioner er låst — operatøren skal bruge koden til ethvert skift.');
    if (c.planes.length && !readable.length) step5.push('Mindst ét plan skal styre et signal der sættes (ikke puls), ellers kan positionen ikke aflæses.');
    if (!(c.validateS >= 1 && c.validateS <= 120)) step4.push('Valideringstid skal være 1–120 s.');
  }
  if (!c.anims.length && !P) step4.push('Et visningssymbol skal have mindst én animation.');
  c.anims.forEach((a, i) => {
    const nm = `Animation ${i + 1}`, kind = srcKind(a.src);
    if (!a.src) { step4.push(`${nm}: vælg hvad der styrer den.`); return; }
    if (a.src === '@pos' && !P) step4.push(`${nm}: symbolet har ingen positioner.`);
    if (a.type === 'color' && kind === 'num') {
      const vs = a.p.th.map((t) => Number(t.v));
      if (vs.some((x) => !Number.isFinite(x))) step4.push(`${nm}: alle grænser skal være tal.`);
      else if (vs.some((x, k) => k && x <= vs[k - 1])) step4.push(`${nm}: grænserne skal stige.`);
    }
    if (['blink', 'visible', 'spin'].includes(a.type) && kind === 'num' && !Number.isFinite(Number(a.p.v))) step4.push(`${nm}: grænsen skal være et tal.`);
    if (a.type === 'level' && !(Number(a.p.max) > Number(a.p.min))) step4.push(`${nm}: max skal være større end min.`);
    if (a.type === 'level' && kind !== 'num') step4.push(`${nm}: niveau kræver et tal-tag.`);
    if (!typesFor(c, a.part).includes(a.type)) step4.push(`${nm}: ${ATYPES[a.type].toLowerCase()} kan ikke bruges på ${LIB[c.type].parts[a.part]?.toLowerCase()}.`);
    if (a.only && !a.only.some(Boolean)) W.push(`${nm} gælder ikke i nogen position.`);
  });
  return { step2, step3, step4, step5, warnings: W, count: step2.length + step3.length + step4.length + step5.length };
}

function stepSkipped(c, i) { return !hasPos(c) && (i === 1 || i === 2 || i === 4); }
function stepsBar(c, v) {

}
function tagOptions(sel, filter, blank) {
  return (blank ? `<option value="">${blank}</option>` : '') + TAGS.filter(filter).map((t) => `<option value="${t.name}" ${t.name === sel ? 'selected' : ''}>${t.name} · ${t.src} · ${t.kind === 'coil' ? 'til/fra' : 'tal'}</option>`).join('');
}

  return c.planes.map((p) => { const s = sig(c, p.signal); if (!s || !isSet(p.values[j])) return null;

}

  if (t === 'B') { const coils = TAGS.filter((x) => x.kind === 'coil' && x.writable).map((x) => x.name);
    c.planes = c.positions.map((_, i) => ({ signal: i < coils.length ? signalFor(c, coils[i]) : (c.signals.push(newSignal()), c.signals.at(-1).id), values: c.positions.map((__, j) => (i === j ? 1 : 0)) })); }
  if (t === 'C') c.planes = [{ signal: signalFor(c, 'Kedel_mode'), values: c.positions.map((_, j) => 1 << j) }];
  if (t === 'D') { const off = c.positions[0]?.label.trim() === '0' ? 0 : 1;
    const bits = Math.max(1, Math.ceil(Math.log2(n - 1 + off + 1)));
    c.planes = Array.from({ length: bits }, (_, b) => ({ signal: signalFor(c, `Vaelger_bit${b}`, b < 3 ? `Vaelger_bit${b}_di` : ''), values: c.positions.map((__, j) => ((j + off) >> b) & 1) })); }
  structural(c);
}
function preset(c) {
  c.name = 'Vælger V1';
  c.positions = Array.from({ length: 7 }, (_, j) => ({ label: String(j + 1), angle: -90 + j * 30 }));
  c.signals = [0, 1, 2].map((b) => newSignal(`Vaelger_bit${b}`, `Vaelger_bit${b}_di`));
  c.planes = c.signals.map((s, b) => ({ signal: s.id, values: c.positions.map((_, j) => ((j + 1) >> b) & 1) }));
  c.anims = c.anims.filter((a) => a.src !== '@pos');
  c.local = { chosen: 0, at: Date.now() - 60000, by: 'olsen' };
  structural(c); step = 2;
}
function structural(c) {
  const n = c.positions.length;
  c.planes.forEach((p) => { const kind = sigKind(sig(c, p.signal)); p.values.length = n; for (let j = 0; j < n; j++) if (p.values[j] === undefined) p.values[j] = kind === 'coil' ? 0 : null; });
  c.signals.forEach((s) => { if (sigKind(s) === 'coil') s.write = 'set'; });
  c.lock ||= { positions: [], pin: '', leave: false }; c.lock.positions.length = n; for (let j = 0; j < n; j++) c.lock.positions[j] = !!c.lock.positions[j];
  c.anims.forEach((a) => {
    if (a.p.colors) { a.p.colors.length = n; for (let j = 0; j < n; j++) a.p.colors[j] ||= '#e4e4e4'; }
    if (a.p.set) { a.p.set.length = n; for (let j = 0; j < n; j++) a.p.set[j] = !!a.p.set[j]; }
    if (a.only) { const len = a.only.length; a.only.length = n; for (let j = len; j < n; j++) a.only[j] = true; }
  });
  resetSim(c);
}

// ===================================================================== hændelser
function setTab(t) {
  tab = t;
  document.getElementById('tab-guide').setAttribute('aria-selected', t === 'guide');
  document.getElementById('tab-ov').setAttribute('aria-selected', t === 'ov');
  document.getElementById('guide').hidden = t !== 'guide';
  document.getElementById('ov').hidden = t !== 'ov';
  if (t === 'ov') renderOv(); else renderGuide();
}
function showToast(text) {
  const el = document.getElementById('toast');
  el.className = 'toast'; el.textContent = text; el.hidden = false;
  clearTimeout(showToast.t); showToast.t = setTimeout(() => { el.hidden = true; }, 4000);
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-action]'); if (!b || b.disabled) return;
  const a = b.dataset.action, i = Number(b.dataset.i), j = Number(b.dataset.j), kk = Number(b.dataset.k), c = cur;
  if (a === 'tab') return setTab(b.dataset.tab);
  // Overview
  if (a === 'ov-sym') { ovSel = b.dataset.id; clickSymbol(symbols.find((x) => x.id === ovSel)); renderFieldSw(); return renderOvLive(); }
  if (a === 'open-dialog') { dialog = { sym: ovSel, open: true, pick: null, msg: '' }; return renderDialog(); }
  if (a === 'close-dialog') { dialog = { sym: null, open: false, pick: null, msg: '' }; return renderDialog(); }
  if (a === 'pick') { const s = symbols.find((x) => x.id === dialog.sym); dialog.pick = j; dialog.pinErr = ''; if (!s.confirm && !needsPin(s, j)) operate(s, j); return renderOvLive(); }
  if (a === 'do-operate') { operate(symbols.find((x) => x.id === dialog.sym), dialog.pick, document.getElementById('pin')?.value || ''); return renderOvLive(); }
  if (a === 'field') { fieldSwitch(symbols.find((x) => x.id === ovSel), j); return renderOvLive(); }
  if (a === 'accept') { const s = symbols.find((x) => x.id === b.dataset.id), r = remotePos(s); if (r != null) s.local = { chosen: r, at: Date.now() - s.validateS * 1000, by: 'olsen (accepteret)' }; return renderOvLive(); }
  // symbolliste og bibliotek
  if (a === 'pick-sym') { cur = symbols.find((x) => x.id === b.dataset.id); newType = null; step = 0; }
  if (a === 'new-sym') newType = '';
  if (a === 'lib') { const nm = document.getElementById('nsname')?.value; newType = b.dataset.t; renderGuide(); document.getElementById('nsname').value = nm || ''; return; }
  if (a === 'cancel-new') newType = null;
  if (a === 'create-sym') {
    const nm = document.getElementById('nsname').value.trim() || `${LIB[newType].label} ${symbols.filter((x) => x.type === newType).length + 1}`;
    const s = newSymbol(newType, nm);
    if (hasPos(s)) { s.signals = [newSignal()]; s.planes = [{ signal: s.signals[0].id, values: s.positions.map((_, jj) => (jj === 0 ? 0 : 1)) }]; }
    symbols.push(s); cur = s; newType = null; step = 0; structural(s);
  }
  if (a === 'del-sym') { const k = symbols.indexOf(c); symbols.splice(k, 1); cur = symbols[0]; if (ovSel === c.id) ovSel = cur.id; step = 0; }
  // guide
  if (a === 'step') step = i;
  if (a === 'next') step = nextStep(c, 1);
  if (a === 'prev') step = nextStep(c, -1);
  if (a === 'preset') preset(c);
  if (a === 'add-sig') { c.signals.push(newSignal()); structural(c); }
  if (a === 'del-sig') { const id = c.signals[i].id; c.signals.splice(i, 1); c.planes.forEach((p) => { if (p.signal === id) p.signal = ''; }); structural(c); }
  if (a === 'add-plane') { const free = c.signals.find((s) => !usedBy(c, s).length); c.planes.push({ signal: free?.id || '', values: c.positions.map(() => (sigKind(free) === 'coil' ? 0 : null)) }); structural(c); }
  if (a === 'del-plane') { c.planes.splice(i, 1); structural(c); }
  if (a === 'add-pos') { c.positions.push({ label: String(c.positions.length + 1), angle: Math.min(150, (Number(c.positions.at(-1)?.angle) || 0) + 30) }); structural(c); }
  if (a === 'del-pos') { c.positions.splice(j, 1); c.planes.forEach((p) => p.values.splice(j, 1)); c.anims.forEach((x) => { x.p.colors?.splice(j, 1); x.p.set?.splice(j, 1); x.only?.splice(j, 1); }); c.lock.positions.splice(j, 1); if (c.local.chosen >= c.positions.length) c.local.chosen = 0; structural(c); }
  if (a === 'cycle') { const v = c.planes[i].values[j]; c.planes[i].values[j] = v === 1 ? 0 : v === 0 ? null : 1; }
  if (a === 'tpl') template(c, b.dataset.t);
  if (a === 'anim-add') { const part = Object.keys(LIB[c.type].parts)[1], src = hasPos(c) ? '@pos' : ''; c.anims.push({ part, type: 'color', src, p: animDefaults(c, 'color', src ? srcKind(src) : 'bool') }); }
  if (a === 'anim-del') c.anims.splice(i, 1);
  if (a === 'anim-up' && i > 0) [c.anims[i - 1], c.anims[i]] = [c.anims[i], c.anims[i - 1]];
  if (a === 'anim-down' && i < c.anims.length - 1) [c.anims[i + 1], c.anims[i]] = [c.anims[i], c.anims[i + 1]];
  if (a === 'anim-th-add') { const th = c.anims[i].p.th; th.push({ v: (Number(th.at(-1)?.v) || 0) + 10, c: '#e06060' }); }
  if (a === 'anim-th-del') c.anims[i].p.th.splice(kk, 1);
  if (a === 'save') { c.saved = true; resetSim(c); showToast(`${c.name} er gemt. Prøv det på Overview.`); ovSel = c.id; return setTab('ov'); }
  if (tab === 'guide') renderGuide();
});
document.addEventListener('change', (e) => {
  const el = e.target, k = el.dataset.bind; if (!k) return;
  const i = Number(el.dataset.i), j = Number(el.dataset.j), kk = Number(el.dataset.k), c = cur, an = c.anims[i];
  if (k === 'simtag') { sim.tags[el.dataset.tag] = tag(el.dataset.tag)?.kind === 'coil' ? (el.checked ? 1 : 0) : Number(el.value) || 0; return renderOvLive(); }

  if (k === 'sim-comm') { sim.comm = el.checked; logWrite(sim.comm ? '— kommunikation tabt' : '— kommunikation genoprettet'); return renderOvLive(); }

  if (k === 'anim-type') { an.type = el.value; if (an.type === 'level' && srcKind(an.src) !== 'num') an.src = 'T1_niveau'; an.p = animDefaults(c, an.type, srcKind(an.src)); }
  if (k === 'anim-src') { an.src = el.value; an.p = animDefaults(c, an.type, srcKind(an.src)); }
  if (k === 'anim-on') an.p.on = el.value;
  if (k === 'anim-off') an.p.off = el.value;
  if (k === 'anim-def') an.p.def = el.value;
  if (k === 'anim-thv') an.p.th[kk].v = el.value;
  if (k === 'anim-thc') an.p.th[kk].c = el.value;
  if (k === 'anim-pc') an.p.colors[kk] = el.value;

// Simuleret proces: tanken fyldes når pumpen kører, ellers tømmes den langsomt.
