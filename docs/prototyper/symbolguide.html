<title>Symbolguide-prototype</title>
<style>
/* Layout: SCADA-app-skal — topbar med to faner; guiden er et panel med trinlinje, Overview er tegning + dialog + PLC-simulator side om side. Farver følger projektets ISA-101-tokens (grå flade, farve kun for tilstand). */
:root {
  --bg: #d9d9d9; --panel: #eeeeee; --panel-2: #e3e3e3; --field: #ffffff; --line: #b8b8b8;
  --text: #1f1f1f; --muted: #5c5c5c; --bar: #2b2b2b; --bar-text: #ffffff; --bar-muted: #bdbdbd;
  --accent: #1f5f99; --accent-bg: #e6eef6; --on-accent: #ffffff;
  --ok: #2e7d32; --ok-bg: #e7f2e8; --warn: #9a5c00; --warn-bg: #fff4e0; --alarm: #c62828; --alarm-bg: #fdecea;
  --sym-face: #e3e3e3; --sym-line: #555555; --sym-grip: #9e9e9e; --sym-ink: #333333;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Consolas, monospace;
  --radius: 4px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1b1d1f; --panel: #26292c; --panel-2: #2f3236; --field: #1f2225; --line: #474b50;
  --text: #e6e6e6; --muted: #a3a7ab; --bar: #111213; --bar-text: #f2f2f2; --bar-muted: #8f9397;
  --accent: #6ea8dc; --accent-bg: #1f3347; --on-accent: #0d1a26;
  --ok: #6cc070; --ok-bg: #1d3320; --warn: #e2a64a; --warn-bg: #3a2c12; --alarm: #ef6a6a; --alarm-bg: #3d1d1d;
  --sym-face: #3a3e43; --sym-line: #9aa0a6; --sym-grip: #6b7075; --sym-ink: #e6e6e6; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #1b1d1f; --panel: #26292c; --panel-2: #2f3236; --field: #1f2225; --line: #474b50;
  --text: #e6e6e6; --muted: #a3a7ab; --bar: #111213; --bar-text: #f2f2f2; --bar-muted: #8f9397;
  --accent: #6ea8dc; --accent-bg: #1f3347; --on-accent: #0d1a26;
  --ok: #6cc070; --ok-bg: #1d3320; --warn: #e2a64a; --warn-bg: #3a2c12; --alarm: #ef6a6a; --alarm-bg: #3d1d1d;
  --sym-face: #3a3e43; --sym-line: #9aa0a6; --sym-grip: #6b7075; --sym-ink: #e6e6e6; color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; } /* også når filen åbnes direkte (uden artefakt-rammen) */
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.4; }
h1, h2, h3 { font-weight: 650; margin: 0; text-wrap: balance; }
h2 { font-size: 1.1rem; } h3 { font-size: 1rem; }
code, .mono { font-family: var(--mono); font-size: .88em; }
.muted { color: var(--muted); } .small { font-size: .85rem; }
button, input, select { font: inherit; color: inherit; }
button { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: .4rem .85rem; cursor: pointer; min-height: 36px; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
button.ghost { border-style: dashed; color: var(--accent); background: transparent; }
button:disabled { opacity: .5; cursor: default; }
input, select { background: var(--field); border: 1px solid var(--line); border-radius: var(--radius); padding: .35rem .5rem; min-width: 0; min-height: 34px; }
input.bad { border: 2px solid var(--alarm); background: var(--alarm-bg); }

.topbar { background: var(--bar); color: var(--bar-text); padding: .6rem 16px; display: flex; flex-wrap: wrap; gap: .4rem 1.2rem; align-items: center; }
.topbar .brand { font-weight: 650; margin-right: .6rem; }
.topbar button { background: transparent; border: 0; border-bottom: 2px solid transparent; border-radius: 0; color: var(--bar-muted); padding: .3rem .1rem; min-height: 32px; }
.topbar button[aria-selected="true"] { color: var(--bar-text); border-bottom-color: var(--bar-text); }
.topbar .note { margin-left: auto; color: var(--bar-muted); font-size: .8rem; }

.wrap { max-width: 1240px; margin: 0 auto; padding-block: 18px 40px; padding-inline: 16px; display: flex; flex-direction: column; gap: 16px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
.panel-head { padding: .8rem 1rem; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: .6rem; }
.panel-body { padding: 1rem; display: flex; flex-direction: column; gap: 1rem; }
.panel-foot { padding: .75rem 1rem; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: .5rem; flex-wrap: wrap; }
.row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
.split { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
.split > * { min-width: 0; }

.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; }
.steps button { width: 100%; text-align: left; font-size: .82rem; background: var(--panel-2); border: 1px solid transparent; color: var(--muted); padding: .35rem .5rem; }
.steps button.done { color: var(--text); }
.steps button.current { background: var(--accent); color: var(--on-accent); font-weight: 650; }
.steps button .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--alarm); margin-left: 4px; vertical-align: middle; }
@media (max-width: 640px) { .steps { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

.field { display: flex; flex-direction: column; gap: .25rem; font-size: .85rem; color: var(--muted); }
.field > input, .field > select { color: var(--text); font-size: .95rem; }
.sigs { display: grid; grid-template-columns: 3rem minmax(0, 1fr) minmax(0, 1fr) 7rem 2.6rem; gap: .5rem .6rem; align-items: end; }
.sigs .lbl { font-weight: 650; padding-bottom: .45rem; }
@media (max-width: 720px) { .sigs { grid-template-columns: minmax(0, 1fr); } .sigs .lbl { grid-column: 1 / -1; padding: .4rem 0 0; } .sigs .hdr { display: none; } }

.tablebox { overflow-x: auto; background: var(--field); border: 1px solid var(--line); border-radius: var(--radius); }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { padding: .5rem .6rem; border-bottom: 1px solid var(--panel-2); text-align: left; vertical-align: middle; }
thead th { background: var(--panel-2); font-weight: 600; border-bottom: 1px solid var(--line); }
td.c, th.c { text-align: center; }
.matrix { min-width: 640px; font-variant-numeric: tabular-nums; }
.matrix thead input { width: 6.5rem; text-align: center; font-weight: 650; }
.cell-coil { width: 4.6rem; font-weight: 600; }
.cell-coil.on { border-color: var(--ok); background: var(--ok-bg); }
.cell-coil.off { color: var(--muted); }
.cell-coil.skip { border-style: dashed; background: transparent; color: var(--muted); }
.cell-num { width: 4.6rem; text-align: center; }
.cell-num.skip { border-style: dashed; }
.sub { font-size: .75rem; color: var(--muted); font-weight: 400; }

.checks { display: flex; flex-direction: column; gap: .25rem; font-size: .9rem; }
.ck-ok { color: var(--ok); } .ck-warn { color: var(--warn); } .ck-err { color: var(--alarm); font-weight: 600; }
.box { border: 1px solid var(--line); border-radius: var(--radius); padding: .75rem .9rem; background: var(--field); }
.box.ok { background: var(--ok-bg); border-color: var(--ok); }
.box.warn { background: var(--warn-bg); border-color: var(--warn); }
.box.err { background: var(--alarm-bg); border-color: var(--alarm); }
fieldset { margin: 0; border: 1px solid var(--line); border-radius: var(--radius); padding: .6rem .9rem .8rem; background: var(--field); display: flex; flex-direction: column; gap: .5rem; }
legend { font-weight: 600; padding: 0 .3rem; }
.choice { display: flex; gap: .6rem; align-items: flex-start; }
.choice input { margin-top: .25rem; min-height: 0; }
.check { display: flex; gap: .5rem; align-items: center; }
.check input { min-height: 0; }
dl.sum { margin: 0; display: grid; grid-template-columns: 9rem minmax(0, 1fr); gap: .35rem .8rem; font-size: .92rem; }
dl.sum dt { color: var(--muted); } dl.sum dd { margin: 0; }

/* Symbol */
.sym { display: block; }
.sym .face { fill: var(--sym-face); stroke: var(--sym-line); stroke-width: 2.5; }
.sym .lab { fill: var(--sym-ink); font: 600 12px var(--font); }
.sym .tick { stroke: var(--sym-ink); stroke-width: 2; }
.sym .grip { fill: var(--sym-grip); stroke: var(--sym-ink); stroke-width: 1.5; }
.sym .grip-mark { fill: var(--sym-ink); }
.sym .grip.pending { fill: var(--field); stroke-dasharray: 3 2; }
.sym .grip.unknown { fill: var(--panel-2); stroke: var(--muted); }
.sym .grip-mark.unknown { fill: var(--muted); }
.sym .ghost { fill: var(--alarm-bg); stroke: var(--alarm); stroke-width: 1.5; stroke-dasharray: 3 2; opacity: .75; }
.sym .badge { stroke-width: 2; }
.sym .badge.confirmed { fill: var(--ok-bg); stroke: var(--ok); } .sym .glyph.confirmed { fill: var(--ok); }
.sym .badge.pending { fill: var(--warn-bg); stroke: var(--warn); } .sym .glyph.pending { fill: var(--warn); }
.sym .badge.mismatch { fill: var(--alarm-bg); stroke: var(--alarm); } .sym .glyph.mismatch { fill: var(--alarm); }
.sym .badge.unknown { fill: var(--panel-2); stroke: var(--muted); } .sym .glyph.unknown { fill: var(--text); }
.sym .glyph { font: 700 14px var(--font); }
.sym .faultframe { fill: none; stroke: var(--alarm); stroke-width: 3; animation: blink 1s steps(2, start) infinite; }
@keyframes blink { to { visibility: hidden; } }
.sym .blinking { animation: blink 1s steps(2, start) infinite; }
.sym .blink-slow { animation-duration: 2s; } .sym .blink-fast { animation-duration: .5s; }
@media (prefers-reduced-motion: reduce) { .sym .blinking { animation: none; opacity: .5; } }
.anims { display: flex; flex-direction: column; gap: .6rem; }
.anim { background: var(--field); border: 1px solid var(--line); border-radius: var(--radius); padding: .6rem .7rem; display: flex; flex-direction: column; gap: .5rem; }
.anim .head { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; }
.anim .head .no { font-weight: 650; min-width: 1.6rem; }
.anim .params { display: flex; flex-wrap: wrap; gap: .4rem .8rem; align-items: center; font-size: .88rem; }
.anim input[type="color"] { width: 2.6rem; height: 32px; padding: 2px; }
.anim input[type="number"] { width: 5.5rem; }
.anim .params label { display: inline-flex; gap: .3rem; align-items: center; }
@media (prefers-reduced-motion: reduce) { .sym .faultframe { animation: none; } }

.symbtn { background: var(--field); border: 1px solid var(--line); padding: .6rem; border-radius: var(--radius); display: flex; flex-direction: column; align-items: center; gap: .3rem; }
.state-chip { font-size: .8rem; font-weight: 650; padding: .1rem .55rem; border-radius: 99px; border: 1px solid; }
.state-chip.confirmed { color: var(--ok); border-color: var(--ok); background: var(--ok-bg); }
.state-chip.pending { color: var(--warn); border-color: var(--warn); background: var(--warn-bg); }
.state-chip.mismatch { color: var(--alarm); border-color: var(--alarm); background: var(--alarm-bg); }
.state-chip.unknown { color: var(--muted); border-color: var(--line); background: var(--panel-2); }
.posbtns { display: grid; grid-template-columns: repeat(auto-fit, minmax(5.5rem, 1fr)); gap: .5rem; }
.posbtns button { min-height: 48px; font-weight: 650; background: var(--field); }
.posbtns button.sel { border: 2px solid var(--accent); background: var(--accent-bg); }
.posbtns button.now { color: var(--muted); }
.log { font-family: var(--mono); font-size: .8rem; display: flex; flex-direction: column; gap: .15rem; max-height: 12rem; overflow: auto; }
.log .t { color: var(--muted); }
.alarmrow { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; }
.prio { background: var(--warn); color: var(--panel); font-size: .72rem; font-weight: 700; padding: .1rem .5rem; border-radius: 3px; letter-spacing: .04em; }
.prio.high { background: var(--alarm); } .prio.low { background: var(--accent); }
.toast { background: var(--ok-bg); border: 1px solid var(--ok); border-radius: var(--radius); padding: .5rem .8rem; }
.sym .face.pending { stroke-dasharray: 4 3; fill: var(--field); }
.sym .face.unknown { fill: var(--panel-2); stroke: var(--muted); }
.sym .body { fill: var(--sym-face); stroke: var(--sym-line); stroke-width: 2.5; }
.sym .part-line { stroke: var(--sym-line); stroke-width: 2.5; fill: none; }
.sym .imp { fill: var(--sym-grip); stroke: var(--sym-ink); stroke-width: 1.5; }
.sym .act { fill: var(--sym-grip); stroke: var(--sym-ink); stroke-width: 1.5; }
.sym .level { fill: var(--accent); opacity: .55; }
.sym .postext { fill: var(--sym-ink); font: 650 13px var(--font); }
.sym .bigtext { fill: var(--sym-ink); font: 700 16px var(--font); }
.sym .valtext { fill: var(--sym-ink); font: 700 15px var(--font); }
.sym .ghosttext { fill: var(--alarm); font: 650 11px var(--font); }
.sym .spinning { animation: spin 1.6s linear infinite; transform-box: fill-box; transform-origin: center; }
.sym .tmove { transition: transform .4s ease-in-out; transform-box: fill-box; transform-origin: center; }
@media (prefers-reduced-motion: reduce) { .sym .tmove { transition: none; } }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .sym .spinning { animation: none; } }
.layout { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
.layout > .side { flex: 0 1 270px; min-width: 0; }
.layout > .main { flex: 999 1 560px; min-width: 0; }
.symlist { display: flex; flex-direction: column; gap: .4rem; }
.symlist button { display: flex; gap: .6rem; align-items: center; text-align: left; background: var(--field); padding: .35rem .5rem; }
.symlist button.sel { border: 2px solid var(--accent); background: var(--accent-bg); }
.symlist .nm { font-weight: 650; display: block; }
.symlist .tp { font-size: .78rem; color: var(--muted); }
.libgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(8.5rem, 1fr)); gap: .5rem; }
.libgrid button { display: flex; flex-direction: column; align-items: center; gap: .2rem; background: var(--field); padding: .5rem; }
.libgrid button.sel { border: 2px solid var(--accent); background: var(--accent-bg); }
.plant { display: grid; grid-template-columns: repeat(auto-fill, minmax(10.5rem, 1fr)); gap: .6rem; }
.plant .symbtn.sel { border: 2px solid var(--accent); }
.steps button.skip { opacity: .55; font-style: italic; }
.impgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr)); gap: .6rem; }
.impcard { background: var(--field); border: 1px solid var(--line); border-radius: var(--radius); padding: .6rem; display: flex; flex-direction: column; align-items: center; gap: .3rem; text-align: center; }
.impcard details { color: var(--muted); }
.sym .padlock rect { fill: var(--warn); } .sym .padlock path { fill: none; stroke: var(--warn); stroke-width: 2.5; }
.lockico { display: inline-block; width: .8em; height: .9em; vertical-align: -.1em; margin-left: .3rem; }
.lockico rect { fill: var(--warn); } .lockico path { fill: none; stroke: var(--warn); stroke-width: 2.5; }
.posbtns button.locked { border-color: var(--warn); }
.pinrow { display: flex; flex-wrap: wrap; gap: .5rem; align-items: end; }
.pinrow input { width: 7rem; font-family: var(--mono); letter-spacing: .4em; text-align: center; }
</style>

<div class="topbar" role="tablist" aria-label="Prototype">
  <span class="brand">HypervisionPLC SCADA</span>

</div>

  <div id="toast" hidden></div>

    <section class="main panel" id="guidepanel" aria-labelledby="g-title"></section>
  </div>

</main>

<script>
// ===================================================================== tags
const TAGS = [
  { name: 'P1_hand_koer', src: 'plc1:coil:10', kind: 'coil', writable: true },
  { name: 'P1_auto_frigiv', src: 'plc1:coil:11', kind: 'coil', writable: true },
  { name: 'P1_stop', src: 'plc1:coil:12', kind: 'coil', writable: true },
  { name: 'P1_start', src: 'plc1:coil:13', kind: 'coil', writable: true },
  { name: 'V1_aaben', src: 'plc1:coil:30', kind: 'coil', writable: true },
  { name: 'K1_koer', src: 'plc1:coil:40', kind: 'coil', writable: true },
  { name: 'Vaelger_bit0', src: 'plc1:coil:20', kind: 'coil', writable: true },
  { name: 'Vaelger_bit1', src: 'plc1:coil:21', kind: 'coil', writable: true },
  { name: 'Vaelger_bit2', src: 'plc1:coil:22', kind: 'coil', writable: true },
  { name: 'Vaelger_bit3', src: 'plc1:coil:23', kind: 'coil', writable: true },
  { name: 'P1_driftsform', src: 'plc1:hr:40', kind: 'reg', dt: 'uint', writable: true },
  { name: 'Kedel_mode', src: 'plc1:hr:41', kind: 'reg', dt: 'uint', writable: true },
  { name: 'P1_offset', src: 'plc1:hr:42', kind: 'reg', dt: 'int', writable: true },
  { name: 'Kedel_trin', src: 'plc1:hr:43', kind: 'reg', dt: 'uint', writable: true, min: 0, max: 10 },
  { name: 'P1_hand_di', src: 'plc1:di:10', kind: 'coil', writable: false },
  { name: 'Vaelger_bit0_di', src: 'plc1:di:20', kind: 'coil', writable: false },
  { name: 'Vaelger_bit1_di', src: 'plc1:di:21', kind: 'coil', writable: false },
  { name: 'Vaelger_bit2_di', src: 'plc1:di:22', kind: 'coil', writable: false },
  { name: 'P1_drift', src: 'plc1:di:15', kind: 'coil', writable: false },
  { name: 'P1_fejl', src: 'plc1:di:14', kind: 'coil', writable: false },
  { name: 'V1_aaben_di', src: 'plc1:di:30', kind: 'coil', writable: false },
  { name: 'T1_hoej', src: 'plc1:di:50', kind: 'coil', writable: false },
  { name: 'L1_alarm', src: 'plc1:di:51', kind: 'coil', writable: false },
  { name: 'P1_driftsform_fb', src: 'plc1:ir:12', kind: 'reg', dt: 'uint', writable: false },
  { name: 'P1_temp', src: 'plc1:ir:30', kind: 'reg', dt: 'int', writable: false },
  { name: 'T1_niveau', src: 'plc1:ir:50', kind: 'reg', dt: 'uint', writable: false, min: 0, max: 100 },
];
const tag = (n) => TAGS.find((t) => t.name === n);
const DT_RANGE = { uint: [0, 65535], int: [-32768, 32767] };
const range = (t) => { const [lo, hi] = DT_RANGE[t.dt || 'uint']; return [t.min ?? lo, t.max ?? hi]; };
const rangeText = (t) => { const [lo, hi] = range(t); return (t.min != null || t.max != null) ? `tal ${lo}–${hi} (tagets min/max)` : `${t.dt || 'uint'} ${lo}–${hi}`; };
const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const fmtT = (t) => new Date(t).toLocaleTimeString('da-DK', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
const isSet = (v) => v != null && v !== '';
const hide = 'position:absolute;left:-9999px';
const STEPS = ['Symbol', 'Signaler', 'Kontakter', 'Visning', 'Betjening', 'Test og gem'];
const STATE_TXT = { confirmed: 'Bekræftet', pending: 'Venter', mismatch: 'Afvigelse', unknown: 'Ukendt', view: 'Visning' };
const GLYPH = { confirmed: '✓', pending: '…', mismatch: '!', unknown: '?' };
// Alarmniveau (prioritet) for afvigelsesalarmen; '' = ingen alarm. Rækkefølge = sortering på Alarmer.
const ALARM_TXT = { '': 'Nej', low: 'Ja — lav', medium: 'Ja — medium', high: 'Ja — høj' };
const ALARM_LBL = { low: 'LAV', medium: 'MEDIUM', high: 'HØJ' };
const ALARM_ORDER = { high: 0, medium: 1, low: 2 };
const ATYPES = { color: 'Farve', blink: 'Blink', visible: 'Synlig', spin: 'Roterer', level: 'Niveau', value: 'Værdi', turn: 'Drej', move: 'Flyt' };

// ===================================================================== symbolbibliotek
// Alle symboler følger samme standard: dele (til animationer), evt. positioner (betjening via kontaktplaner),
// samme guide i 6 trin og samme tilstandsmærke. Kun tegningen og standardopsætningen er forskellig.
const LIB = {
  selector: { label: 'Omskifter', positions: [['Hand', -45], ['0', 0], ['Auto', 45]], angles: true,
    parts: { bg: 'Baggrund', face: 'Skive', grip: 'Greb', frame: 'Ramme' }, spin: [], level: [], text: [] },

// ===================================================================== validering
function validate(c) {
  const step2 = [], step3 = [], step4 = [], step5 = [], W = [];
  const K = opKind(c), P = K === 'positions';
  if (K === 'pulse' || K === 'entry') {
    const s = c.signals[0], t = tag(s?.tag);
    if (c.signals.length !== 1) step2.push('Vælg præcis ét signal.');
    if (s && !t) step2.push(`${s.id}: vælg et kommando-tag.`);
    if (t && !t.writable) step2.push(`${s.id}: ${t.name} er ikke skrivbart.`);
    if (t && K === 'pulse' && t.kind !== 'coil') step2.push('En trykknap kræver et til/fra-tag.');
    if (t && K === 'entry' && t.kind !== 'reg') step2.push('Et setpunkt kræver et tal-tag (register).');
    if (K === 'pulse' && !(Number(c.pulseMs) >= 100 && Number(c.pulseMs) <= 10000)) step5.push('Pulslængde skal være 100–10000 ms.');
  }
  if (P) {
    const labels = c.positions.map((p) => p.label.trim());
    if (!c.signals.length) step2.push('Tilføj mindst ét signal.');
    const seen = {};
    c.signals.forEach((s) => {
      const t = tag(s.tag);
      if (!t) { step2.push(`${s.id}: vælg et kommando-tag.`); return; }
      if (!t.writable) step2.push(`${s.id}: ${t.name} er ikke skrivbart.`);
      if (seen[s.tag]) step2.push(`${s.id} og ${seen[s.tag]} bruger samme tag ${s.tag}.`); else seen[s.tag] = s.id;
      if (s.fb && tag(s.fb)?.kind !== t.kind) step2.push(`${s.id}: tilbagemeldingen har en anden type end kommandoen.`);
      if (!usedBy(c, s).length) W.push(`${s.id} (${s.tag}) bruges ikke af nogen kontaktplan.`);
    });
    if (labels.some((l) => !l)) step3.push('Alle positioner skal have et navn.');
    if (new Set(labels).size !== labels.length) step3.push('To positioner har samme navn.');
    if (!c.planes.length) step3.push('Opret mindst én kontaktplan.');
    c.planes.forEach((p, i) => {
      const nm = `Plan ${i + 1}`, s = sig(c, p.signal), t = tag(s?.tag);
      if (!s) { step3.push(`${nm}: vælg hvilket signal planet styrer.`); return; }
      const first = c.planes.findIndex((q) => q.signal === p.signal);
      if (first !== i) step3.push(`${nm}: ${s.id} styres allerede af plan ${first + 1} — ét signal pr. plan.`);
      p.values.forEach((v, j) => {
        if (!isSet(v) || t?.kind !== 'reg') return;
        const x = Number(v);
        if (!Number.isInteger(x)) step3.push(`${nm}, ${labels[j] || j + 1}: "${v}" er ikke et heltal.`);
        else if (x < range(t)[0] || x > range(t)[1]) step3.push(`${nm}, ${labels[j] || j + 1}: ${x} er uden for ${rangeText(t)} for ${s.tag}.`);
      });
      const skip = p.values.map((v, j) => (isSet(v) ? null : `"${labels[j]}"`)).filter(Boolean);
      if (skip.length) W.push(`${nm} røres ikke i ${skip.join(', ')} — ${s.id} beholder værdien fra forrige position.`);
    });
    const readable = c.planes.filter((p) => sig(c, p.signal) && sig(c, p.signal).write !== 'pulse');
    const cols = c.positions.map((_, j) => JSON.stringify(readable.map((p) => (isSet(p.values[j]) ? Number(p.values[j]) : null))));
    cols.forEach((col, j) => { const k = cols.indexOf(col); if (k !== j) step3.push(`"${labels[k]}" og "${labels[j]}" har ens kontaktmønster og kan ikke skelnes.`); });
    c.signals.forEach((s) => {
      if (s.write !== 'pulse') return;
      const ms = Number(s.ms), vals = c.planes.filter((p) => p.signal === s.id).flatMap((p) => p.values.filter(isSet).map(Number));
      if (!(ms >= 100 && ms <= 10000)) step5.push(`${s.id}: pulslængde skal være 100–10000 ms.`);
      if (!isSet(s.rest)) step5.push(`${s.id}: hvileværdien skal sættes.`);
      else { const r = Number(s.rest), t = tag(s.tag);
        if (!Number.isInteger(r)) step5.push(`${s.id}: hvileværdien skal være et heltal.`);
        else if (vals.includes(r)) step5.push(`${s.id}: hvileværdien ${r} er også en positions værdi.`);
        else if (t?.kind === 'reg' && (r < range(t)[0] || r > range(t)[1])) step5.push(`${s.id}: hvileværdien ${r} er uden for ${rangeText(t)}.`); }
    });
    if (c.lock.positions.some(Boolean) && !/^\d{4}$/.test(c.lock.pin || '')) step5.push('Koden til nøglelåsen skal være præcis 4 cifre.');
    if (c.lock.positions.length && c.lock.positions.every(Boolean)) W.push('Alle positioner er låst — operatøren skal bruge koden til ethvert skift.');
    if (c.planes.length && !readable.length) step5.push('Mindst ét plan skal styre et signal der sættes (ikke puls), ellers kan positionen ikke aflæses.');
    if (!(c.validateS >= 1 && c.validateS <= 120)) step4.push('Valideringstid skal være 1–120 s.');
  }
  if (!c.anims.length && K === 'view') step4.push('Et visningssymbol skal have mindst én animation.');
  c.anims.forEach((a, i) => {
    const nm = `Animation ${i + 1}`, kind = srcKind(a.src);
    if (!a.src) { step4.push(`${nm}: vælg hvad der styrer den.`); return; }
    if (a.src === '@pos' && !P) step4.push(`${nm}: symbolet har ingen positioner.`);
    if (a.type === 'color' && kind === 'num') {
      const vs = a.p.th.map((t) => Number(t.v));
      if (vs.some((x) => !Number.isFinite(x))) step4.push(`${nm}: alle grænser skal være tal.`);
      else if (vs.some((x, k) => k && x <= vs[k - 1])) step4.push(`${nm}: grænserne skal stige.`);
    }
    if (['blink', 'visible', 'spin'].includes(a.type) && kind === 'num' && !Number.isFinite(Number(a.p.v))) step4.push(`${nm}: grænsen skal være et tal.`);
    if (a.type === 'level' && !(Number(a.p.max) > Number(a.p.min))) step4.push(`${nm}: max skal være større end min.`);
    if (a.type === 'level' && kind !== 'num') step4.push(`${nm}: niveau kræver et tal-tag.`);
    if ((a.type === 'turn' || a.type === 'move') && kind === 'num' && !(Number(a.p.max) > Number(a.p.min))) step4.push(`${nm}: max skal være større end min.`);
    if (!typesFor(c, a.part).includes(a.type)) step4.push(`${nm}: ${ATYPES[a.type].toLowerCase()} kan ikke bruges på ${libOf(c).parts[a.part]?.toLowerCase()}.`);
    if (a.only && !a.only.some(Boolean)) W.push(`${nm} gælder ikke i nogen position.`);
  });
  return { step2, step3, step4, step5, warnings: W, count: step2.length + step3.length + step4.length + step5.length };
}

function animParams(c, a, i) {
  const kind = srcKind(a.src), Lb = (j) => esc(c.positions[j]?.label);

  if (a.type === 'turn') {
    if (kind === 'pos') return '<span>vinkel pr. position:</span>' + c.positions.map((_, j) => `<label>${Lb(j)}<input type="number" id="apa-${i}-${j}" data-bind="anim-pa" data-i="${i}" data-k="${j}" value="${esc(a.p.pa?.[j] ?? 0)}">°</label>`).join('');
    if (kind === 'bool') return `<label>Fra<input type="number" id="aa0-${i}" data-bind="anim-a0" data-i="${i}" value="${esc(a.p.a0)}">°</label><label>Til<input type="number" id="aa1-${i}" data-bind="anim-a1" data-i="${i}" value="${esc(a.p.a1)}">°</label>`;
    return `<label>min<input type="number" id="alo-${i}" data-bind="anim-min" data-i="${i}" value="${esc(a.p.min)}"></label><label>max<input type="number" id="ahi-${i}" data-bind="anim-max" data-i="${i}" value="${esc(a.p.max)}"></label><label>vinkel ved min<input type="number" id="aa0-${i}" data-bind="anim-a0" data-i="${i}" value="${esc(a.p.a0)}">°</label><label>ved max<input type="number" id="aa1-${i}" data-bind="anim-a1" data-i="${i}" value="${esc(a.p.a1)}">°</label><span class="muted">drejer om delens centrum</span>`;
  }
  if (a.type === 'move') {
    if (kind === 'pos') return '<span>forskydning pr. position (dx, dy):</span>' + c.positions.map((_, j) => `<label>${Lb(j)}<input type="number" id="apx-${i}-${j}" data-bind="anim-pdx" data-i="${i}" data-k="${j}" value="${esc(a.p.pdx?.[j] ?? 0)}" aria-label="${Lb(j)} dx"><input type="number" id="apy-${i}-${j}" data-bind="anim-pdy" data-i="${i}" data-k="${j}" value="${esc(a.p.pdy?.[j] ?? 0)}" aria-label="${Lb(j)} dy"></label>`).join('');
    const mm = kind === 'num' ? `<label>min<input type="number" id="alo-${i}" data-bind="anim-min" data-i="${i}" value="${esc(a.p.min)}"></label><label>max<input type="number" id="ahi-${i}" data-bind="anim-max" data-i="${i}" value="${esc(a.p.max)}"></label>` : '';
    return `${mm}<label>${kind === 'bool' ? 'Til:' : 'ved max:'} dx<input type="number" id="adx-${i}" data-bind="anim-dx" data-i="${i}" value="${esc(a.p.dx)}"></label><label>dy<input type="number" id="ady-${i}" data-bind="anim-dy" data-i="${i}" value="${esc(a.p.dy)}"></label><span class="muted">${kind === 'bool' ? 'Fra = på plads' : 'på plads ved min'}</span>`;
  }
  if (a.type === 'level') return `<label>min<input type="number" id="alo-${i}" data-bind="anim-min" data-i="${i}" value="${esc(a.p.min)}"></label><label>max<input type="number" id="ahi-${i}" data-bind="anim-max" data-i="${i}" value="${esc(a.p.max)}"></label><span class="muted">tom ved min, fuld ved max</span>`;
  if (a.type === 'value') return kind === 'num' ? `<label>enhed<input id="au-${i}" data-bind="anim-unit" data-i="${i}" value="${esc(a.p.unit)}" style="width: 5rem"></label><label>decimaler<input type="number" id="ad-${i}" data-bind="anim-dec" data-i="${i}" value="${esc(a.p.dec)}" min="0" max="3"></label>` : `<span class="muted">${kind === 'pos' ? 'viser positionens navn' : 'viser Til/Fra'}</span>`;
  if (a.type === 'color') {
    if (kind === 'bool') return color('anim-on', a.p.on, 'Til') + (a.p.off ? color('anim-off', a.p.off, 'Fra') : '<span>Fra</span>') + `<label class="check"><input type="checkbox" id="aof-${i}" data-bind="anim-off-orig" data-i="${i}" ${a.p.off ? '' : 'checked'}>${a.p.off ? 'brug symbolets egen farve' : 'symbolets egen farve'}</label>`;
    if (kind === 'num') return (a.p.th ||= []).map((t, k) => `<label>≥<input type="number" id="atv-${i}-${k}" data-bind="anim-thv" data-i="${i}" data-k="${k}" value="${esc(t.v)}" aria-label="Grænse ${k + 1}"></label>${color('anim-thc', t.c, '', k)}<button class="small" data-action="anim-th-del" data-i="${i}" data-k="${k}" aria-label="Fjern grænse ${k + 1}" ${a.p.th.length < 2 ? 'disabled' : ''}>✕</button>`).join('<span class="muted">·</span>')

  }
  const verb = { blink: 'Blinker', visible: 'Synlig', spin: 'Roterer' }[a.type];
  if (kind === 'bool') return `<label>${verb}<select id="aw-${i}" data-bind="anim-when" data-i="${i}"><option value="on" ${a.p.when === 'on' ? 'selected' : ''}>når Til</option><option value="off" ${a.p.when === 'off' ? 'selected' : ''}>når Fra</option></select></label>`;
  if (kind === 'num') return `<label>${verb} når ≥<input type="number" id="an-${i}" data-bind="anim-numv" data-i="${i}" value="${esc(a.p.v)}"></label>`;
  return `<span>${verb} i:</span>` + c.positions.map((_, j) => `<label class="check"><input type="checkbox" id="as-${i}-${j}" data-bind="anim-pset" data-i="${i}" data-k="${j}" ${a.p.set?.[j] ? 'checked' : ''}>${Lb(j)}</label>`).join('');
}
function animSrcOptions(c, sel, type) {
  const numOnly = type === 'level';

}
function animUI(c) {

    <div class="head"><span class="no">${i + 1}</span>

      <span style="margin-left: auto; display: inline-flex; gap: .3rem"><button class="small" data-action="anim-up" data-i="${i}" ${i === 0 ? 'disabled' : ''} aria-label="Flyt op">▲</button><button class="small" data-action="anim-down" data-i="${i}" ${i === c.anims.length - 1 ? 'disabled' : ''} aria-label="Flyt ned">▼</button><button class="small" data-action="anim-del" data-i="${i}" aria-label="Fjern animation ${i + 1}">✕</button></span></div>

    ${P ? `<div class="params"><span class="muted">Gælder i positionerne:</span>${c.positions.map((p, j) => `<label class="check"><input type="checkbox" id="ao-${i}-${j}" data-bind="anim-only" data-i="${i}" data-k="${j}" ${!a.only || a.only[j] ? 'checked' : ''}>${esc(p.label)}</label>`).join('')}${a.only && !a.only.some(Boolean) ? '<span class="ck-warn">! ingen positioner valgt</span>' : ''}</div>` : ''}</div>`).join('')}
    <div><button class="ghost" data-action="anim-add" ${c.anims.length >= 12 ? 'disabled' : ''}>+ Tilføj animation</button> <span class="small muted">Står to animationer på samme del, vinder den nederste.</span></div></div>`;

function renderLive6() {

    ${c.signals.map((s) => { const planes = c.planes.filter((p) => p.signal === s.id);

      return `<tr><th scope="row" style="font-weight: 400">${esc(sigName(s))}</th><td class="mono">${sim.comm ? '—' : esc(sim.cmd[s.tag] ?? '—')}</td><td class="mono">${sim.comm ? '<span class="ck-err">komm.fejl</span>' : esc(sim.read[rk(s)] ?? '—') + (s.fb ? ` <span class="sub">${esc(s.fb)}</span>` : ' <span class="sub">= kommando</span>')}</td><td>${s.write === 'pulse' ? '<span class="muted">puls — tæller ikke</span>' : !planes.length ? '<span class="muted">ikke brugt</span>' : esc(fits.join(', ') || '—')}</td></tr>`; }).join('')}

  const n = c.positions.length, pos = c.op === 'positions';
  hvParts.forEach(({ id, spec }) => {
    const p = spec.params || {};
    if (spec.anim === 'fill') {
      if (pos) c.anims.push({ part: id, type: 'color', src: '@pos', p: { colors: n === 2 ? [p.off || '#9e9e9e', p.on || '#2e7d32'] : Array.from({ length: n }, () => '#e4e4e4') } });
      else if (c.signals[0]) c.anims.push({ part: id, type: 'color', src: c.signals[0].tag, p: { on: p.on || '#2e7d32', off: p.off || '#9e9e9e' } });
    } else if (spec.anim === 'text') {
      if (pos) c.anims.push({ part: id, type: 'value', src: '@pos', p: { unit: '', dec: 0 } });
      else if (c.signals[0]) c.anims.push({ part: id, type: 'value', src: c.signals[0].tag, p: { unit: '', dec: 1 } });
    } else if (spec.anim === 'move' && pos) {
      const f = (j) => (n > 1 ? (j - (p.min ?? 0)) / (((p.max ?? 1) - (p.min ?? 0)) || 1) : 0);
      c.anims.push({ part: id, type: 'move', src: '@pos', p: { pdx: c.positions.map((_, j) => Math.round((p.dx || 0) * f(j))), pdy: c.positions.map((_, j) => Math.round((p.dy || 0) * f(j))) } });
      needs.add('move');
    } else if (spec.anim === 'rotate' && pos) {
      const lo = p.min ?? 0, hi = p.max ?? 1, a0 = p.angle_min ?? 0, a1 = p.angle_max ?? 360;
      c.anims.push({ part: id, type: 'turn', src: '@pos', p: { pa: c.positions.map((_, j) => Math.round(a0 + (a1 - a0) * ((j - lo) / ((hi - lo) || 1)))) } });
      needs.add('turn');
    }
  });
  if (!click) {
    // Visningssymbol: foreslå animationer ud fra de navngivne dele (svarer til vejledningen i symbolbiblioteket)
    const has = (id) => ids.includes(id);
    if (has('fyld')) c.anims.push({ part: 'fyld', type: 'level', src: 'Demo_niveau', p: { min: 0, max: 100 } });
    if (has('soejle')) c.anims.push({ part: 'soejle', type: 'level', src: 'Demo_niveau', p: { min: 0, max: 100 } });
    if (has('rotor')) c.anims.push({ part: 'rotor', type: 'spin', src: 'Demo_drift', p: { when: 'on' } });
    if (has('flamme')) c.anims.push({ part: 'flamme', type: 'visible', src: 'Demo_drift', p: { when: 'on' } });
    if (has('viser')) { c.anims.push({ part: 'viser', type: 'turn', src: 'Demo_tryk', p: { min: 0, max: 10, a0: -120, a1: 120 } }); needs.add('turn'); }
    if (has('vaerdi')) c.anims.push(def.id === 'elmaaler' ? { part: 'vaerdi', type: 'value', src: 'Demo_energi', p: { unit: '', dec: 1 } }
      : { part: 'vaerdi', type: 'value', src: 'Demo_maaling', p: { unit: '°C', dec: 1 } });
    if (!c.anims.length) c.anims.push({ part: 'all', type: 'color', src: 'Demo_drift', p: { on: '#7cc47f', off: '' } });
    if (!ids.length) notes.push('Ingen navngivne dele — kun hele symbolet kan animeres.');
    if (def.id === 'knap') notes.push('Har ingen klik-handling i dag; kan gøres betjenbar i trin 1 (Til/fra eller Trykknap).');
  }
  notes.unshift(`Vejledning i dag: ${def.hint}`);
  return { lib, tpl: c, needs: [...needs], notes };
}
IMPORT_SRC.symbols.forEach((def) => { const r = convertDef(def); IMPDEF[def.id] = { def, ...r }; });

function newImported(defId, name) {
  const d = IMPDEF[defId], c = JSON.parse(JSON.stringify(d.tpl));
  c.id = `imp${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`;
  const base = name || d.def.label, same = symbols.filter((x) => x.name === base || x.name.startsWith(base + ' ')).length;
  c.name = same ? `${base} ${same + 1}` : base;
  c.local = { chosen: 0, at: Date.now() - 60000, by: 'olsen' };
  structural(c);
  return c;
}
// Skift betjeningsform for et importeret symbol (trin 1)
function setOp(c, op) {
  c.op = op; c.positions = []; c.signals = []; c.planes = []; c.lock = { positions: [], pin: '', leave: false };
  if (op === 'positions') {
    c.positions = [{ label: 'Fra', angle: 0 }, { label: 'Til', angle: 0 }];
    const s = newSignal(demoTag('coil', `${c.imp}_cmd`)); c.signals = [s]; c.planes = [{ signal: s.id, values: [0, 1] }];
  }
  if (op === 'pulse') c.signals = [newSignal(demoTag('coil', `${c.imp}_cmd`))];
  if (op === 'entry') c.signals = [newSignal(demoTag('reg', `${c.imp}_sp`, { min: 0, max: 100 }))];
  c.anims = c.anims.filter((a) => a.src !== '@pos');
  c.local = { chosen: 0, at: Date.now() - 60000, by: 'olsen' };
  structural(c);
}

// Tegning: symbolets egen SVG, skaleret ind i den fælles ramme; animationer sættes på delene (id) eller hele symbolet.
const impCache = new Map();
function recolor(el, col) {
  const shapes = el.tagName === 'g' ? [...el.querySelectorAll('path,rect,circle,ellipse,polygon,polyline,line')] : [el];
  shapes.forEach((s) => {
    if (s.tagName === 'text') { s.setAttribute('fill', col); return; }
    if (s.tagName === 'line' || s.tagName === 'polyline' || s.getAttribute('fill') === 'none') s.setAttribute('stroke', col);
    else s.setAttribute('fill', col);
  });
}
function drawImported(c, styles) {
  const d = IMPDEF[c.imp], def = d.def;
  const key = def.id + JSON.stringify(styles);
  let out = impCache.get(key);
  if (!out) {
    const g = svgDoc(def.svg).documentElement.firstElementChild;
    [g, ...g.querySelectorAll('*')].forEach((e) => [...e.attributes].forEach((a) => { if (a.name.startsWith('data-hv')) e.removeAttribute(a.name); }));
    for (const [part, st] of Object.entries(styles)) {
      if (part === 'bg' || part === 'frame') continue;
      const el = part === 'all' ? g : g.querySelector(`[id="${part}"]`); if (!el) continue;
      const bb = part === 'all' ? def.bbox : def.parts[part];
      if (colOk(st.color)) recolor(el, st.color);
      if (st.frac != null && el.tagName === 'rect') { const h = bb.h * st.frac; el.setAttribute('y', (bb.y + bb.h - h).toFixed(1)); el.setAttribute('height', h.toFixed(1)); }
      if (st.text != null && el.tagName === 'text') el.textContent = st.text;
      const cls = [], css = [];
      if ('dx' in st || 'angle' in st) {
        // Flyt/Drej som CSS-transform om delens centrum, så skiftet glider (transition) i stedet for at hoppe
        if (el.getAttribute('transform')) {
          el.setAttribute('transform', `translate(${st.dx || 0} ${st.dy || 0}) rotate(${st.angle || 0} ${(bb.x + bb.w / 2).toFixed(1)} ${(bb.y + bb.h / 2).toFixed(1)}) ${el.getAttribute('transform')}`);
        } else {
          cls.push('tmove'); css.push(`transform:translate(${(st.dx || 0).toFixed(2)}px,${(st.dy || 0).toFixed(2)}px) rotate(${(st.angle || 0).toFixed(2)}deg)`);
        }
      }
      if (st.blink) cls.push('blinking', `blink-${st.blink}`);
      if (st.spin) cls.push('spinning');
      if (st.blink || st.spin) css.push(`animation-delay:-@@${st.blink || 'spin'}@@ms`);
      if (cls.length) el.setAttribute('class', cls.join(' '));
      if (css.length) el.setAttribute('style', css.join(';'));
      if (st.hidden) el.setAttribute('visibility', 'hidden');
    }
    const bw = def.bbox.w || 1, bh = def.bbox.h || 1, s = Math.min(116 / bw, 118 / bh, 2.2);
    const tx = 12 + (116 - bw * s) / 2 - def.bbox.x * s, ty = 10 + (118 - bh * s) / 2 - def.bbox.y * s;
    out = `<g transform="translate(${tx.toFixed(1)} ${ty.toFixed(1)}) scale(${s.toFixed(3)})">${new XMLSerializer().serializeToString(g)}</g>`;
    if (impCache.size > 2000) impCache.clear();
    impCache.set(key, out);
  }
  // Fasen sættes ved hver tegning, så alle blink med samme frekvens kører i takt
  return out.replace(/@@(\w+)@@/g, (_, k) => Date.now() % (k === 'spin' ? 1600 : BLINK_MS[k] || 1000));
}

// Faneblad: symbolbiblioteket i dag
let libFilter = 'all';
function renderLib() {
  const all = Object.values(IMPDEF);
  const ok = all.filter((d) => !d.needs.length).length;
  const byNeed = {};
  all.forEach((d) => d.needs.forEach((n) => (byNeed[n] ||= []).push(d.def.label)));
  const noParts = all.filter((d) => !Object.keys(d.def.parts).length).length;
  const cats = IMPORT_SRC.categories.filter((k) => libFilter === 'all' || k.id === libFilter);
  document.getElementById('libview').innerHTML = `
  <section class="panel" aria-labelledby="lib-title">
    <div class="panel-head">
      <div class="row" style="justify-content: space-between"><h2 id="lib-title">Symbolbiblioteket i dag · ${all.length} symboler</h2><span class="small muted">Importeret fra frontend/src/lib/symbols.ts</span></div>
      <div class="row"><span class="state-chip confirmed">✓ ${ok} passer direkte</span><span class="state-chip pending">! ${all.length - ok} kræver en tilføjelse til standarden</span><span class="small muted">${noParts} har ingen navngivne dele</span></div>
    </div>
    <div class="panel-body">
      <div class="box warn"><b>Det mangler standarden for at dække alle symboler i dag</b>
        <ul style="margin: .4rem 0 0; padding-left: 1.2rem">${Object.entries(byNeed).map(([n, l]) => `<li><b>${NEED_TXT[n]}</b> — ${l.map(esc).join(', ')}</li>`).join('')}</ul>
        <div class="small muted" style="margin-top: .4rem">Prototypen har de fire tilføjelser med, så alle symboler kan prøves nu.</div></div>
      <div class="row"><span class="small muted">Vis:</span>
        <button data-action="lib-filter" data-cat="all" class="${libFilter === 'all' ? 'primary' : ''}">Alle</button>
        ${IMPORT_SRC.categories.map((k) => `<button data-action="lib-filter" data-cat="${k.id}" class="${libFilter === k.id ? 'primary' : ''}">${esc(k.label)}</button>`).join('')}
        <button class="ghost" data-action="imp-add" data-cat="${libFilter}" style="margin-left: auto">+ Tilføj ${libFilter === 'all' ? 'alle' : 'kategorien'} til anlægget</button></div>
      ${cats.map((k) => `<h3>${esc(k.label)}</h3><div class="impgrid">${all.filter((d) => d.def.category === k.id).map((d) => {
        const t = d.tpl, P = t.op === 'positions', p = P ? 1 % t.positions.length : null;
        return `<div class="impcard">${drawSymbol(t, { grip: p, size: 96, styles: evalAnims(t, p) })}
          <b>${esc(d.def.label)}</b><span class="small muted">${KIND_TXT[t.op]}${P ? ` · ${t.positions.map((x) => esc(x.label)).join('/')}` : ''}</span>
          ${d.needs.length ? `<span class="state-chip pending">! ${d.needs.map((n) => ATYPES[n] || (n === 'pulse' ? 'Trykknap' : 'Setpunkt')).join(', ')}</span>` : '<span class="state-chip confirmed">✓ passer</span>'}
          <span class="small muted">${t.anims.length} animation${t.anims.length === 1 ? '' : 'er'} foreslået</span>
          <details class="small" style="text-align: left; width: 100%"><summary>Detaljer</summary><ul style="margin: .3rem 0 0; padding-left: 1.1rem">${d.notes.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></details>
          <button data-action="imp-try" data-id="${d.def.id}">Prøv i guiden</button></div>`; }).join('')}</div>`).join('')}
    </div>
  </section>`;
}

// Betjening af trykknap (puls) og setpunkt (indtastning) — tilføjelser til standarden, så de importerede symboler virker
function blockedMsg(c) {
  if (c.fault && Number(tagValue(c.fault))) return `${c.name}: betjening er blokeret — ${c.fault} er aktiv.`;
  if (sim.comm) return 'Ingen forbindelse til PLC\'en — intet er skrevet.';
  return '';
}
function operatePulse(c) {
  const s = c.signals[0];
  if (!s?.tag) { dialog = { sym: c.id, open: false, pick: null, msg: `${c.name}: der er ikke valgt et tag.` }; return; }
  const m = blockedMsg(c); if (m) { dialog = { sym: c.id, open: false, pick: null, msg: m }; return; }
  logWrite(`— ${c.name}: puls af olsen`); logWrite(`1. ${s.tag} ← 1 (puls ${c.pulseMs} ms)`);
  sim.cmd[s.tag] = 1; if (sim.mode !== 'none') sim.read[rk(s)] = 1;
  setTimeout(() => { sim.cmd[s.tag] = 0; sim.read[rk(s)] = 0; logWrite(`   ${s.tag} ← 0 (puls slut)`); }, Number(c.pulseMs) || 500);
  dialog = { sym: c.id, open: false, pick: null, msg: '' };
}
function operateEntry(c, raw) {
  const s = c.signals[0], t = tag(s?.tag);
  if (!t) { dialog.err = 'Der er ikke valgt et tag.'; return; }
  const v = Number(String(raw ?? '').replace(',', '.'));
  if (String(raw ?? '').trim() === '' || !Number.isFinite(v)) { dialog.err = 'Skriv et tal.'; return; }
  const [lo, hi] = range(t);
  if (v < lo || v > hi) { dialog.err = `Værdien skal være mellem ${lo} og ${hi}.`; return; }
  const m = blockedMsg(c); if (m) { dialog = { sym: c.id, open: false, pick: null, msg: m }; return; }
  logWrite(`— ${c.name}: ny værdi ${v} af olsen`); logWrite(`1. ${s.tag} ← ${v}`);
  sim.cmd[s.tag] = v;
  const mode = sim.mode;
  setTimeout(() => { if (sim.comm) return; if (mode === 'ok') sim.read[rk(s)] = v; if (mode === 'wrong') sim.read[rk(s)] = v + 1; }, sim.delayS * 1000);
  dialog = { sym: c.id, open: false, pick: null, msg: '' };
}

renderGuide();
