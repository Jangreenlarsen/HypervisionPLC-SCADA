# nginx foran HypervisionPLC SCADA: TLS-terminering + WebSocket.
# SCADA-serveren (uvicorn) lytter kun på 127.0.0.1:8000.
# Certifikat: /etc/hypervisionplc-scada/tls/{fullchain,privkey}.pem — selvsigneret (deploy/tls-selfsigned.sh)
# eller senere Let's Encrypt (samme stier, så denne fil ikke skal ændres).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/hypervisionplc-scada/tls/fullchain.pem;
    ssl_certificate_key /etc/hypervisionplc-scada/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SCADA:5m;
    ssl_session_timeout 1h;

    # HSTS slås først til når certifikatet er fra Let's Encrypt (ellers låses browsere ude ved certifikatskift).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    # 'unsafe-inline' for style er nødvendigt: SVG-tegninger bruger style-attributter, og animationerne sætter style.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    # SVG-upload er max 5 MB; JSON-indpakningen gør body'en lidt større.
    client_max_body_size 8m;

    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
