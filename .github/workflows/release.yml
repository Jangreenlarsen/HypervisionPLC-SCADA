# Udgivelse: når et versions-tag (fx v3.13.0) pushes, bygges pakken (den samme som OTA-opdateringen bruger) og lægges
# på GitHub som en Release med kontrolsum. deploy/bootstrap.sh installerer en ny Raspberry Pi fra den nyeste Release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # oprette Release og uploade pakken

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tagget skal passe med version.json
        run: |
          V=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' version.json)
          echo "version.json: $V — tag: $GITHUB_REF_NAME"
          [ "$GITHUB_REF_NAME" = "v$V" ] || { echo "::error::Tagget $GITHUB_REF_NAME passer ikke med version.json ($V)"; exit 1; }
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installér frontend-afhængigheder
        working-directory: frontend
        run: npm ci

      - name: Frontend-tests
        working-directory: frontend
        run: npm test

      - name: Byg pakken
        run: sh deploy/make-package.sh

      - name: Kontrolsum
        run: for f in scada-*.tar; do sha256sum "$f" > "$f.sha256"; cat "$f.sha256"; done

      - name: Udgivelsesnoter fra RELEASE_NOTES.md
        run: |
          awk -v v="## v$VERSION " 'index($0, v) == 1 { on = 1; next } on && /^## v/ { exit } on' RELEASE_NOTES.md > notes.md
          cat >> notes.md <<'EOF'

          ---
          **Ny Raspberry Pi:** `curl -fsSL https://raw.githubusercontent.com/Jangreenlarsen/HypervisionPLC-SCADA/main/deploy/bootstrap.sh | sudo sh`
          **Opdatér en kørende server:** hent `scada-*.tar` herunder og upload den under *System › Opdatering*.
          EOF
          cat notes.md

      - name: Udgiv
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" scada-*.tar scada-*.tar.sha256 --title "HypervisionPLC SCADA $GITHUB_REF_NAME" --notes-file notes.md
